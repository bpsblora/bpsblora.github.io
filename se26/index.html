<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Tambahkan target-densitydpi dan atur skala agar tidak 'pecah' di mode desktop HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Capaian SE2026 - BPS Kab Blora</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    html, body { 
      width: 100%;
      height: 100%;
      background: #211909; 
      overflow: hidden;
      /* Memaksa browser HP merespons sentuhan secara langsung tanpa jeda */
      touch-action: manipulation; 
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxyEBqihwCpsuUIwbxkGsl5TYB0YV0p-O4YuZ3k0WokImqB6mlyed2BhH5TRKsNbZlI/exec"
    allow="fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
  </iframe>
</body>
</html>
