<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- width=device-width dan maximum-scale=1.0 memaksa browser HP memetakan koordinat sentuh dengan akurat -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard Capaian SE2026 - BPS Kab Blora</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    html, body { 
      width: 100%;
      height: 100%;
      background: #211909; 
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      /* Properti kunci agar iframe meneruskan event sentuh secara langsung tanpa jeda scaling */
      touch-action: manipulation;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwhEWULqA2cxVRQ3lfnx9WuEFMDJeFTad12fKxnqmQUVoj5-xsXYIuZ1eNa5GFrHroV/exec"
    allow="fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
  </iframe>
</body>
</html>
