<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B'link ~ BPS Blora dalam Link</title>
  <link rel="shortcut icon" type="image/jpg" href="favicon.ico"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <style>
    /* ===================== RESET & BASE ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      /* Light mode */
      --bg-page:    #F4F5F7;
      --bg-card:    #FFFFFF;
      --bg-header:  #FFFFFF;
      --bg-input:   #F0F2F5;
      --border:     rgba(0,0,0,0.08);
      --border-md:  rgba(0,0,0,0.14);
      --text-1:     #1A1A1A;
      --text-2:     #5A5F6B;
      --text-3:     #9BA3B0;
      --accent:     #0F6E56;
      --accent-bg:  #E1F5EE;
      --accent-text:#085041;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-hover:0 4px 12px rgba(0,0,0,0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page:    #111315;
        --bg-card:    #1C1E21;
        --bg-header:  #161819;
        --bg-input:   #252729;
        --border:     rgba(255,255,255,0.07);
        --border-md:  rgba(255,255,255,0.13);
        --text-1:     #ECEEF1;
        --text-2:     #8D96A3;
        --text-3:     #525A64;
        --accent:     #1D9E75;
        --accent-bg:  #0A2B22;
        --accent-text:#5DCAA5;
        --shadow-card: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-hover:0 4px 16px rgba(0,0,0,0.35);
      }
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg-page);
      color: var(--text-1);
      min-height: 100vh;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ===================== HEADER ===================== */
    .header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo {
      width: 38px; height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0F6E56 0%, #1D9E75 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
      letter-spacing: -0.3px; flex-shrink: 0;
      user-select: none;
    }

    .brand-text { flex: 1; min-width: 0; }
    .brand-name {
      font-size: 17px; font-weight: 700; line-height: 1.2;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px; color: var(--text-3); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Search */
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 15px; color: var(--text-3); pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px 9px 34px;
      font-size: 14px; font-family: var(--font);
      color: var(--text-1);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15,110,86,0.12);
    }
    .search-clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 14px; color: var(--text-3); cursor: pointer;
      display: none; background: none; border: none; padding: 2px;
    }
    .search-clear:hover { color: var(--text-1); }

    /* ===================== CATEGORY TABS ===================== */
    .cat-bar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cat-bar::-webkit-scrollbar { display: none; }

    .cat-list {
      display: flex; gap: 2px;
      padding: 8px 0;
      list-style: none;
      white-space: nowrap;
    }

    .cat-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 13px;
      border-radius: var(--radius-md);
      font-size: 12.5px; font-weight: 500; font-family: var(--font);
      cursor: pointer; border: none; background: transparent;
      color: var(--text-2);
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .cat-btn i { font-size: 14px; }
    .cat-btn:hover { background: var(--bg-input); color: var(--text-1); }
    .cat-btn.active {
      background: var(--accent-bg);
      color: var(--accent-text);
      font-weight: 600;
    }

    /* ===================== MAIN CONTENT ===================== */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* Result info */
    .result-info {
      font-size: 12px; color: var(--text-3);
      margin-bottom: 16px;
      display: none;
    }
    .result-info.visible { display: block; }

    /* Section */
    .section { margin-bottom: 28px; }
    .section[data-hidden="true"] { display: none; }

    .section-header {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 12px;
    }

    .section-icon {
      width: 38px; height: 38px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
    }

    .section-label { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }

    .section-count {
      font-size: 11px; color: var(--text-3);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 99px; padding: 2px 8px;
      margin-left: 2px;
    }

    /* App Grid — minmax lebih lebar untuk gambar landscape */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    /* Card enter animation */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    /* Shimmer sweep saat hover */
    @keyframes shimmerSwipe {
      from { transform: translateX(-100%) skewX(-12deg); }
      to   { transform: translateX(220%)  skewX(-12deg); }
    }

    .app-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 12px 13px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: transform 0.25s cubic-bezier(0.22,1,0.36,1),
                  box-shadow 0.25s cubic-bezier(0.22,1,0.36,1),
                  border-color 0.25s ease;
      animation: cardIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* Lapisan shimmer — muncul sekali saat hover masuk */
    .app-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 45%; height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.18) 50%,
        transparent 100%
      );
      transform: translateX(-100%) skewX(-12deg);
      pointer-events: none;
      z-index: 1;
    }

    /* Garis aksen bawah yang tumbuh saat hover */
    .app-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      width: 0%; height: 2.5px;
      background: var(--accent);
      border-radius: 2px;
      transform: translateX(-50%);
      transition: width 0.3s cubic-bezier(0.22,1,0.36,1);
      pointer-events: none;
    }

    .app-card:hover {
      transform: translateY(-5px) scale(1.025);
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
      border-color: var(--border-md);
    }
    /* Picu shimmer */
    .app-card:hover::before {
      animation: shimmerSwipe 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    /* Garis aksen tumbuh penuh */
    .app-card:hover::after {
      width: 60%;
    }
    .app-card:active {
      transform: translateY(-2px) scale(1.01);
      box-shadow: var(--shadow-hover);
    }

    /* Gambar zoom in halus saat card di-hover */
    .app-card:hover .app-icon-img {
      transform: scale(1.06);
    }
    .app-icon-img {
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
    }

    /* Nama aplikasi berubah warna saat hover */
    .app-card:hover .app-name {
      color: var(--accent);
    }
    .app-name {
      transition: color 0.2s ease;
    }

    /*
      Gambar ikon landscape: cover penuh tanpa ruang putih.
      Rasio 3/2 cocok untuk banner kantor.
    */
    .app-img-box {
      width: 100%;
      aspect-ratio: 3 / 2;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-input);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .app-icon-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .app-icon-img.fallback-hidden { display: none; }

    /* Fallback icon (jika gambar gagal load) */
    .app-icon-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }

    .app-name {
      font-size: 12.5px; font-weight: 600; line-height: 1.4;
      color: var(--text-1); word-break: break-word;
    }

    /* Lordicon section header */
    .section-icon {
      width: 56px !important; height: 56px !important;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-icon lord-icon {
      width: 56px; height: 56px;
    }

    .vpn-tag {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.3px;
      padding: 2px 5px; border-radius: 5px;
      background: #FEF3C7; color: #92400E;
      border: 1px solid #FDE68A;
      line-height: 1;
    }

    @media (prefers-color-scheme: dark) {
      .vpn-tag { background: #2D2210; color: #FCD34D; border-color: #4A3510; }
    }

    /* ===================== EMPTY STATE ===================== */
    .empty-state {
      text-align: center; padding: 48px 20px;
      color: var(--text-3);
    }
    .empty-state i { font-size: 36px; display: block; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }
    .empty-state strong { color: var(--text-2); }

    /* ===================== FAB ===================== */
    .fab {
      position: fixed; bottom: 22px; right: 22px;
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--accent);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px;
      box-shadow: 0 3px 10px rgba(15,110,86,0.35);
      transition: background 0.15s, transform 0.15s;
      z-index: 50;
      text-decoration: none;
    }
    .fab:hover { background: #085041; transform: scale(1.07); }

    /* ===================== PAGE LOAD ANIMATIONS ===================== */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    /* Shimmer skeleton saat halaman pertama load */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }

    .header  { animation: slideDown 0.45s cubic-bezier(0.22,1,0.36,1) both; }
    .cat-bar { animation: slideDown 0.45s 0.07s cubic-bezier(0.22,1,0.36,1) both; }

    .section { animation: fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both; }
    .section:nth-child(1) { animation-delay: 0.10s; }
    .section:nth-child(2) { animation-delay: 0.18s; }
    .section:nth-child(3) { animation-delay: 0.26s; }
    .section:nth-child(4) { animation-delay: 0.34s; }
    .section:nth-child(5) { animation-delay: 0.42s; }

    .fab { animation: fadeIn 0.5s 0.45s ease both; }

    /* Stagger per-card via JS style="animation-delay:Xms" */
    .app-card { animation: cardIn 0.32s cubic-bezier(0.22,1,0.36,1) both; }

    /* Respek prefer-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 600px) {
      .header { padding: 12px 14px 10px; }
      .main   { padding: 16px 12px 80px; }
      /* 2 kolom di HP — cukup untuk gambar landscape terbaca */
      .app-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .brand-name { font-size: 16px; }
      .section-label { font-size: 17px; }
    }
    @media (max-width: 360px) {
      .app-grid { grid-template-columns: 1fr; }
    }

    /* ===================== UTIL ===================== */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-top">
      <div class="logo" aria-hidden="true">B'L</div>
      <div class="brand-text">
        <div class="brand-name">B'link</div>
        <div class="brand-sub">BPS Kabupaten Blora — Portal Aplikasi</div>
      </div>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search search-icon" aria-hidden="true"></i>
      <input
        class="search-input"
        id="searchInput"
        type="search"
        placeholder="Cari aplikasi..."
        autocomplete="off"
        aria-label="Cari aplikasi"
      >
      <button class="search-clear" id="searchClear" aria-label="Hapus pencarian">
        <i class="ti ti-x"></i>
      </button>
    </div>
  </header>

  <!-- ===== CATEGORY TABS ===== -->
  <nav class="cat-bar" aria-label="Filter kategori">
    <ul class="cat-list" id="catList">
      <li>
        <button class="cat-btn active" data-cat="all">
          <i class="ti ti-layout-grid" aria-hidden="true"></i> Semua
        </button>
      </li>
      <li>
        <button class="cat-btn" data-cat="umum">
          <i class="ti ti-building" aria-hidden="true"></i> Umum
        </button>
      </li>
      <li>
        <button class="cat-btn" data-cat="keuangan">
          <i class="ti ti-coin" aria-hidden="true"></i> Keuangan
        </button>
      </li>
      <li>
        <button class="cat-btn" data-cat="sdm">
          <i class="ti ti-users" aria-hidden="true"></i> SDM
        </button>
      </li>
      <li>
        <button class="cat-btn" data-cat="teknis">
          <i class="ti ti-tool" aria-hidden="true"></i> Teknis & MK
        </button>
      </li>
      <li>
        <button class="cat-btn" data-cat="pelayanan">
          <i class="ti ti-headset" aria-hidden="true"></i> Pelayanan
        </button>
      </li>
    </ul>
  </nav>

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <p class="sr-only">Daftar aplikasi yang digunakan BPS Kabupaten Blora</p>
    <div class="result-info" id="resultInfo" aria-live="polite"></div>

    <!-- Umum -->
    <section class="section" id="section-umum" data-cat="umum">
      <div class="section-header">
        <div class="section-icon">
          <lord-icon src="https://cdn.lordicon.com/yqiuuheo.json" trigger="loop" delay="2000" style="width:56px;height:56px;"></lord-icon>
        </div>
        <span class="section-label">Umum</span>
        <span class="section-count" id="count-umum">0</span>
      </div>
      <div class="app-grid" id="grid-umum"></div>
    </section>

    <!-- Keuangan -->
    <section class="section" id="section-keuangan" data-cat="keuangan">
      <div class="section-header">
        <div class="section-icon">
          <lord-icon src="https://cdn.lordicon.com/qnwzeeae.json" trigger="loop" delay="2000" style="width:56px;height:56px;"></lord-icon>
        </div>
        <span class="section-label">Keuangan</span>
        <span class="section-count" id="count-keuangan">0</span>
      </div>
      <div class="app-grid" id="grid-keuangan"></div>
    </section>

    <!-- SDM -->
    <section class="section" id="section-sdm" data-cat="sdm">
      <div class="section-header">
        <div class="section-icon">
          <lord-icon src="https://cdn.lordicon.com/eodavnff.json" trigger="loop" delay="2000" style="width:56px;height:56px;"></lord-icon>
        </div>
        <span class="section-label">Sumber Daya Manusia</span>
        <span class="section-count" id="count-sdm">0</span>
      </div>
      <div class="app-grid" id="grid-sdm"></div>
    </section>

    <!-- Teknis -->
    <section class="section" id="section-teknis" data-cat="teknis">
      <div class="section-header">
        <div class="section-icon">
          <lord-icon src="https://cdn.lordicon.com/kjtalhau.json" trigger="loop" delay="2000" style="width:56px;height:56px;"></lord-icon>
        </div>
        <span class="section-label">Teknis &amp; Manajemen Kerja</span>
        <span class="section-count" id="count-teknis">0</span>
      </div>
      <div class="app-grid" id="grid-teknis"></div>
    </section>

    <!-- Pelayanan -->
    <section class="section" id="section-pelayanan" data-cat="pelayanan">
      <div class="section-header">
        <div class="section-icon">
          <lord-icon src="https://cdn.lordicon.com/ndzqltsx.json" trigger="loop" delay="2000" style="width:56px;height:56px;"></lord-icon>
        </div>
        <span class="section-label">Pelayanan Statistik &amp; Kehumasan</span>
        <span class="section-count" id="count-pelayanan">0</span>
      </div>
      <div class="app-grid" id="grid-pelayanan"></div>
    </section>

    <!-- Empty state (hidden by default) -->
    <div class="empty-state" id="emptyState" style="display:none;" aria-live="polite">
      <i class="ti ti-search-off" aria-hidden="true"></i>
      <p>Tidak ada aplikasi yang cocok dengan "<strong id="emptyTerm"></strong>"</p>
    </div>
  </main>

  <!-- FAB: Usulkan Link -->
  <a class="fab" href="https://forms.gle/rWG5RQVnPFb2GE9fA" target="_blank" rel="noopener" title="Usulkan Link Baru" aria-label="Usulkan link baru">
    <i class="ti ti-plus" aria-hidden="true"></i>
  </a>

  <!-- Lordicon -->
  <script src="https://cdn.lordicon.com/lordicon.js"></script>

  <!-- ===== DATA FILES ===== -->
  <!--
    Pastikan file-file JS berikut tersedia di folder yang sama dengan index.html.
    Setiap file mendefinisikan variabel array global, contoh:
      umum_json     = [ { nama, url, ikon, isVPN? }, ... ]
      keuangan_json = [ { nama, url, ikon, isVPN? }, ... ]
      sdm_json      = [ { nama, url, ikon, isVPN? }, ... ]
      teknis_json   = [ { nama, url, ikon, tim, isVPN? }, ... ]
      pelayanan_json= [ { nama, url, ikon, isVPN? }, ... ]
  -->
  <script src="umum.js"></script>
  <script src="keuangan.js"></script>
  <script src="sdm.js"></script>
  <script src="teknis.js"></script>
  <script src="pelayanan.js"></script>

  <!-- ===== APP SCRIPT ===== -->
  <script>
    /* -------------------------------------------------------
       CONFIG
       Mapping kategori → { variabel data, warna ikon, fallback icon }
       Sesuaikan fallbackIcon jika ingin ikon default berbeda per kategori
    ------------------------------------------------------- */
    const CONFIG = {
      umum:      { data: () => umum_json,      iconBg: '#E6F1FB', iconColor: '#185FA5', fallbackIcon: 'ti-app-window' },
      keuangan:  { data: () => keuangan_json,  iconBg: '#FAEEDA', iconColor: '#854F0B', fallbackIcon: 'ti-cash'        },
      sdm:       { data: () => sdm_json,        iconBg: '#E1F5EE', iconColor: '#0F6E56', fallbackIcon: 'ti-user'        },
      teknis:    { data: () => teknis_json,     iconBg: '#EEEDFE', iconColor: '#534AB7', fallbackIcon: 'ti-tool'        },
      pelayanan: { data: () => pelayanan_json,  iconBg: '#FBEAF0', iconColor: '#993556', fallbackIcon: 'ti-headset'     },
    };

    /* -------------------------------------------------------
       STATE
    ------------------------------------------------------- */
    let activeFilter = 'all';
    let searchTerm   = '';

    /* -------------------------------------------------------
       BUILD CARD HTML
       Mendukung dua format ikon:
         • URL gambar  → ditampilkan sebagai <img>
         • kosong/null → fallback ke Tabler icon
    ------------------------------------------------------- */
    function buildCard(item, cfg, idx) {
      const isVPN = item.isVPN && item.isVPN.length > 2;
      const vpnTag = isVPN ? '<span class="vpn-tag">VPN</span>' : '';
      /* Stagger: tiap kartu muncul sedikit lebih lambat, max 600ms */
      const delay = Math.min(idx * 40, 600);

      /* Semua gambar dibungkus app-img-box (rasio 16:9, contain)
         sehingga gambar landscape/banner tampil penuh tanpa crop */
      let iconHtml;
      if (item.ikon && item.ikon.trim() !== '') {
        iconHtml = `
          <div class="app-img-box" style="background:${cfg.iconBg};">
            <img
              class="app-icon-img"
              src="${escHtml(item.ikon)}"
              alt="${escHtml(item.nama)}"
              loading="lazy"
              onerror="
                this.classList.add('fallback-hidden');
                this.nextElementSibling.style.display='flex';
              "
            >
            <div class="app-icon-wrap" style="color:${cfg.iconColor}; display:none;">
              <i class="ti ${cfg.fallbackIcon}" aria-hidden="true"></i>
            </div>
          </div>
        `;
      } else {
        iconHtml = `
          <div class="app-img-box" style="background:${cfg.iconBg};">
            <div class="app-icon-wrap" style="color:${cfg.iconColor};">
              <i class="ti ${cfg.fallbackIcon}" aria-hidden="true"></i>
            </div>
          </div>
        `;
      }

      return `
        <a class="app-card" href="${escHtml(item.url)}" target="_blank" rel="noopener"
           style="animation-delay:${delay}ms;"
           aria-label="${escHtml(item.nama)}${isVPN ? ' (butuh VPN)' : ''}">
          ${vpnTag}
          ${iconHtml}
          <span class="app-name">${escHtml(item.nama)}</span>
        </a>
      `;
    }

    /* -------------------------------------------------------
       RENDER semua kategori
    ------------------------------------------------------- */
    function render() {
      const term = searchTerm.toLowerCase();
      let totalVisible = 0;

      Object.entries(CONFIG).forEach(([cat, cfg]) => {
        let items;
        try { items = cfg.data(); }
        catch(e) { items = []; }

        /* Sort: teknis pakai tim dulu, lainnya langsung nama */
        items = [...items].sort((a, b) => {
          if (a.tim && b.tim) {
            const t = a.tim.localeCompare(b.tim, 'id');
            if (t !== 0) return t;
          }
          return a.nama.localeCompare(b.nama, 'id');
        });

        /* Filter pencarian */
        const filtered = term
          ? items.filter(i =>
              i.nama.toLowerCase().includes(term) ||
              (i.desc && i.desc.toLowerCase().includes(term))
            )
          : items;

        const section  = document.getElementById('section-' + cat);
        const grid     = document.getElementById('grid-'    + cat);
        const countEl  = document.getElementById('count-'   + cat);

        const show = (activeFilter === 'all' || activeFilter === cat) && filtered.length > 0;
        section.setAttribute('data-hidden', show ? 'false' : 'true');
        section.style.display = show ? '' : 'none';

        grid.innerHTML = filtered.map((item, idx) => buildCard(item, cfg, idx)).join('');
        countEl.textContent = filtered.length;
        totalVisible += filtered.length;
      });

      /* Empty state */
      const emptyEl = document.getElementById('emptyState');
      if (totalVisible === 0 && term) {
        document.getElementById('emptyTerm').textContent = searchTerm;
        emptyEl.style.display = '';
      } else {
        emptyEl.style.display = 'none';
      }

      /* Result info */
      const infoEl = document.getElementById('resultInfo');
      if (term) {
        infoEl.textContent = totalVisible + ' aplikasi ditemukan untuk "' + searchTerm + '"';
        infoEl.classList.add('visible');
      } else {
        infoEl.classList.remove('visible');
      }
    }

    /* -------------------------------------------------------
       ESCAPE HTML untuk keamanan
    ------------------------------------------------------- */
    function escHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* -------------------------------------------------------
       SEARCH
    ------------------------------------------------------- */
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');

    searchInput.addEventListener('input', function() {
      searchTerm = this.value;
      searchClear.style.display = searchTerm ? 'block' : 'none';
      /* Saat mengetik, tampilkan semua kategori */
      if (searchTerm) {
        activeFilter = 'all';
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-cat="all"]').classList.add('active');
      }
      render();
    });

    searchClear.addEventListener('click', function() {
      searchInput.value = '';
      searchTerm = '';
      this.style.display = 'none';
      searchInput.focus();
      render();
    });

    /* -------------------------------------------------------
       CATEGORY FILTER
    ------------------------------------------------------- */
    document.getElementById('catList').addEventListener('click', function(e) {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      /* Clear search saat ganti kategori agar tidak bingung */
      searchInput.value = '';
      searchTerm = '';
      searchClear.style.display = 'none';

      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.cat;
      render();
    });

    /* -------------------------------------------------------
       INIT
    ------------------------------------------------------- */
    render();
  </script>
</body>
</html>
